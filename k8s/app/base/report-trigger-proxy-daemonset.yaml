apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: report-trigger-proxy
  namespace: sola-app
  labels:
    app: report-trigger-proxy
spec:
  selector:
    matchLabels:
      app: report-trigger-proxy
  template:
    metadata:
      labels:
        app: report-trigger-proxy
    spec:
      # hostNetwork: pod deli omrežje node-1 in doseže 127.0.0.1:8790,
      # kjer je reverzni SSH tunel do Debian trigger webhooka.
      hostNetwork: true
      nodeSelector:
        kubernetes.io/hostname: vmi3670013
      containers:
      - name: socat
        image: alpine/socat:latest
        imagePullPolicy: IfNotPresent
        # TCP-LISTEN:8791 (na node IP) -> 127.0.0.1:8790 (tunel na Debian)
        command: ["socat", "TCP-LISTEN:8791,fork,reuseaddr", "TCP:127.0.0.1:8790"]
        resources:
          requests:
            memory: "16Mi"
            cpu: "10m"
          limits:
            memory: "64Mi"
            cpu: "100m"