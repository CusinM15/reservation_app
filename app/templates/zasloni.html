<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ school_name }} - {% if pokazi_nadomescanja %}Nadomeščanja{% else %}Dobrodošli{% endif %}</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;height:100vh;overflow:hidden;background:#fff}
.fullscreen-mode{height:100vh;display:flex;flex-direction:column}
.fs-header{background:#0b3b5c;color:#fff;padding:0.5rem 1rem;display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.fs-time{font-size:0.95rem;background:rgba(255,255,255,0.15);padding:0.3rem 1rem;border-radius:20px}
.fs-content-wrapper{flex:1;position:relative;overflow:hidden;background:#fff}
.view{position:absolute;top:0;left:0;width:100%;height:100%;overflow:auto}
.table-view{padding:15px 20px 20px;background:#fff}
.table-view table{width:100%;border-collapse:collapse;table-layout:fixed}
.table-view thead tr{position:sticky;top:0;z-index:10}
.table-view th,.table-view td{padding:18px 12px;border-bottom:1px solid #dee2e6;vertical-align:top;font-size:1.05rem;text-align:left}
.table-view th{background:#1b6b8f;color:#fff}
.table-view tr:nth-child(even){background:#f8f9fc}
.msg-view{background:#0b3b5c;display:flex;align-items:center;justify-content:center}
.msg-view .msg-text{color:#fff;font-size:4rem;font-weight:bold;text-align:center;padding:40px 60px;text-shadow:0 2px 8px rgba(0,0,0,0.4)}
.welcome-view{background:#0b3b5c;display:flex;align-items:center;justify-content:center}
.welcome-view .welcome-text{color:#fff;font-size:3rem;font-weight:bold;text-align:center;padding:40px 60px}
</style>
</head>
<body>
<div class="fullscreen-mode">
  <div class="fs-header">
    <h2>{{ school_name }}{% if pokazi_nadomescanja %} - Nadomeščanja{% else %} - Dobrodošli nazaj!{% endif %}</h2>
    <div class="fs-time"><span class="fs-datum"></span> <span class="fs-cas"></span></div>
  </div>
  <div class="fs-content-wrapper">
    {% if pokazi_nadomescanja and tabela %}
    <div class="view table-view" id="tableView">{{ tabela | safe }}</div>
    {% elif pokazi_nadomescanja %}
    <div class="view msg-view"><div class="msg-text">Danes ni nadomeščanj</div></div>
    {% else %}
    <div class="view welcome-view"><div class="welcome-text">Dobrodošli nazaj!</div></div>
    {% endif %}
  </div>
</div>
<script>
const IMA_TABELO = {{ 'true' if pokazi_nadomescanja and tabela else 'false' }};
const HITROST = {{ hitrost_drsenja }};
const MIN_CAS_TABELE = {{ min_cas_tabele }} * 1000;
const CASOVNI_PAS = {{ time_zone | tojson }};

function updateTime() {
  const now = new Date();
  try {
    document.querySelector('.fs-datum').textContent =
      new Intl.DateTimeFormat('sl-SI', { timeZone: CASOVNI_PAS, day:'2-digit', month:'2-digit', year:'numeric' }).format(now);
    document.querySelector('.fs-cas').textContent =
      new Intl.DateTimeFormat('sl-SI', { timeZone: CASOVNI_PAS, hour:'2-digit', minute:'2-digit' }).format(now);
  } catch (e) {
    document.querySelector('.fs-datum').textContent = now.toLocaleDateString('sl-SI');
    document.querySelector('.fs-cas').textContent = now.toLocaleTimeString('sl-SI', {hour:'2-digit', minute:'2-digit'});
  }
}
updateTime();
setInterval(updateTime, 1000);

// Samodejno drsenje tabele nadomeščanj (če je višja od ekrana)
const tableView = document.getElementById('tableView');
if (IMA_TABELO && tableView && tableView.querySelector('table')) {
  const max = () => tableView.scrollHeight - tableView.clientHeight;
  setInterval(() => {
    if (max() > 0) {
      if (tableView.scrollTop >= max()) { tableView.scrollTop = 0; }
      else { tableView.scrollTop += HITROST; }
    }
  }, 16);
}
</script>
</body>
</html>
