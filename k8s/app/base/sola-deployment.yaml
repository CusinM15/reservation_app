apiVersion: apps/v1
kind: Deployment
metadata:
  name: sola-app
  namespace: sola-app
  labels:
    app: sola-app
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: sola-app
  template:
    metadata:
      labels:
        app: sola-app
    spec:
      topologySpreadConstraints:
        # ScheduleAnyway (ne DoNotSchedule): razporejanje po vozliščih je želja,
        # ne trda zahteva. Z DoNotSchedule je bil rollout blokiran, ko je k3s-3
        # padel (NotReady od 18. 9. 2026) — na voljo sta le k3s-1 in k3s-2,
        # tretje vozlišče pa kot domena z 0 pod-i postavi minCount=0 in s tem
        # onemogoči razporejanje tudi na zdravi vozlišči.
        # Ko bo k3s-3 spet zdrav, lahko vrneš DoNotSchedule.
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: sola-app
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values: [sola-app]
              topologyKey: kubernetes.io/hostname
      containers:
      - name: app
        image: mato12345/sola-app:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8002
          name: http
        envFrom:
        - configMapRef:
            name: sola-config
        - secretRef:
            name: sola-secrets
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        volumeMounts:
        - name: tmp-volume
          mountPath: /tmp
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 8
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 20
          periodSeconds: 30
          failureThreshold: 5
      volumes:
      - name: tmp-volume
        emptyDir:
          sizeLimit: 2Gi
