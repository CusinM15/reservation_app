apiVersion: batch/v1
kind: CronJob
metadata:
  name: sola-db-backup
  namespace: sola-app
spec:
  schedule: "0 4 * * *"
  timeZone: "Europe/Ljubljana"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: backup
            image: mato12345/sola-app:latest
            imagePullPolicy: Always
            # Vsaka šola dobi SVOJO .sql kopijo (samo njeni podatki) po e-pošti.
            # Zakaj ne pg_dump? V sliki ga NI (stari scripts.db_backup je zato
            # tiho odpovedoval), poleg tega bi pg_dump izvozil CELO bazo.
            command:
            - python
            - -m
            - scripts.school_backups
            env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: sola-secrets
                  key: DATABASE_URL
            - name: MAIL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: sola-secrets
                  key: MAIL_USERNAME
            - name: MAIL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sola-secrets
                  key: MAIL_PASSWORD
            - name: MAIL_SERVER
              valueFrom:
                secretKeyRef:
                  name: sola-secrets
                  key: MAIL_SERVER
            - name: MAIL_PORT
              valueFrom:
                secretKeyRef:
                  name: sola-secrets
                  key: MAIL_PORT
            - name: MAIL_FROM
              valueFrom:
                secretKeyRef:
                  name: sola-secrets
                  key: MAIL_FROM
            - name: BACKUP_EMAIL
              valueFrom:
                secretKeyRef:
                  name: sola-secrets
                  key: BACKUP_EMAIL
          restartPolicy: OnFailure
