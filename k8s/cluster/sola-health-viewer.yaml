# ─────────────────────────────────────────────────────────────────────────
# k8s/cluster/sola-health-viewer.yaml — RBAC za gumb »🩺 Pošlji zdravje«
# v /global-settings: service account (default v sola-app) sme BRATI
# node-e, pode, longhorn vole itd., da app v podu sestavi polno poročilo
# o stanju clustra (scripts/daily_report.py). Samo branje — nič pisanja.
# ─────────────────────────────────────────────────────────────────────────
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sola-app-health-viewer
rules:
  - apiGroups: [""]
    resources: ["nodes", "pods", "events", "services", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["longhorn.io"]
    resources: ["volumes", "nodes", "replicas", "engines", "backups", "backuptargets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sola-app-health-viewer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: sola-app-health-viewer
subjects:
  - kind: ServiceAccount
    name: default
    namespace: sola-app