apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sola-app
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:CusinM15/reservation_app_sell.git
    targetRevision: main
    path: k8s/app/overlays/production-lb
  destination:
    server: https://kubernetes.default.svc
    namespace: sola-app
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
