<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vnos dejavnosti - Šolski App</title>
<style>
  body { font-family: Arial, sans-serif; margin: 20px; background: #f5f5f5; }
  .container { max-width: 1500px; margin: auto; background: white; padding: 20px; border-radius: 10px; }
  .nav { margin-bottom: 20px; }
  .nav a { margin-right: 12px; font-size: 14px; color: #007bff; text-decoration: none; }
  .nav a:hover { text-decoration: underline; }
  h2 { margin-top: 0; }
  .tabs { display: flex; flex-wrap: wrap; gap: 6px; margin: 16px 0; }
  .tab { padding: 8px 14px; background: #e9ecef; border: 1px solid #ced4da; border-radius: 6px;
         cursor: pointer; font-size: 13px; user-select: none; }
  .tab.active { background: #007bff; color: white; border-color: #007bff; }
  .section-title { background: #007bff; color: white; padding: 10px 14px; border-radius: 6px;
                   margin: 24px 0 12px; font-size: 16px; font-weight: bold; }
  table { width: 100%; border-collapse: collapse; }
  th, td { border: 1px solid #dee2e6; padding: 6px 8px; font-size: 13px; text-align: left; vertical-align: top; }
  th { background: #f1f3f5; }
  .btn { padding: 5px 10px; background: #007bff; color: white; border: none; border-radius: 4px;
         cursor: pointer; font-size: 12px; display: inline-block; }
  .btn-danger { background: #dc3545; }
  .btn-success { background: #28a745; }
  .btn-warning { background: #ffc107; color: #000; }
  .btn-sm { padding: 2px 7px; font-size: 11px; }
  .msg { padding: 10px; border-radius: 6px; margin: 12px 0; display: none; font-size: 14px; }
  .msg.error { background: #f8d7da; color: #721c24; display: block; }
  .msg.success { background: #d4edda; color: #155724; display: block; }
  .row-actions button { margin-right: 4px; }
  .muted { color: #6c757d; font-style: italic; font-size: 12px; }
  input[type=text], input[type=number], select, textarea {
    padding: 4px 6px; border: 1px solid #ced4da; border-radius: 4px; font-size: 13px; }
  .checkbox-list { display: flex; flex-wrap: wrap; gap: 8px; font-size: 13px; }
  .checks label { margin-right: 8px; white-space: nowrap; }
  .toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 6px; }
  .hint { font-size: 12px; color: #555; }
  .hide { display: none !important; }
</style>
</head>
<body>
<div class="container">
  <div class="nav">
    <a href="/">← Domov (urnik)</a>
  </div>
  <h2>📋 Vnos dejavnosti (dnevi dejavnosti)</h2>
  <p class="hint">Samo vodstvo/admin. Vsaka generacija ima svojo podstran. Ob shranjevanju z izbranim datumom,
    "celoten dan" in prostori se samodejno ustvarijo blokirani datumi, rezervacije (ure 1–5) in prekličejo
    ocenjevanja + email učiteljem.</p>

  <div id="msg" class="msg"></div>

  <!-- Zavihki podstrani -->
  <div class="tabs" id="grade-tabs"></div>

  <div id="content"></div>
</div>

<script>
const SECTIONS = ['KULTURNI', 'NARAVOSLOVNI', 'TEHNIŠKI', 'ŠPORTNI'];
const GRADE_LABELS = {1:'1. razred',2:'2. razred',3:'3. razred',4:'4. razred',5:'5. razred',
                      6:'6. razred',7:'7. razred',8:'8. razred',9:'9. razred',ip:'IP/POUK'};
let META = null;        // razredi, prostori, razpored ...
let currentGrade = '1';
let sectionsData = {};  // grade -> section -> rows[]

const $ = id => document.getElementById(id);

function api(path, opts){
  return fetch(path, opts).then(async r => {
    const data = await r.json().catch(() => ({}));
    if(!r.ok) throw new Error(data.detail || ('Napaka ' + r.status));
    return data;
  });
}

function isGradeNumeric(g){ return /^[1-9]$/.test(g); }

async function init(){
  try{
    META = await api('/api/dejavnosti/meta');
  }catch(e){
    // meta vrne 403, če uporabnik ni vodstvo/admin — stran bi morala preprečiti, a vseeno obdelaj
    alert('Napaka pri nalaganju konfiguracije: ' + e.message);
    return;
  }
  buildTabs();
  await loadGrade(currentGrade);
}

function buildTabs(){
  const tabs = $('grade-tabs');
  tabs.innerHTML = '';
  META.grades.forEach(g => {
    const div = document.createElement('div');
    div.className = 'tab' + (g === currentGrade ? ' active' : '');
    div.textContent = GRADE_LABELS[g] || g;
    div.dataset.grade = g;
    div.onclick = () => { currentGrade = g; document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active')); div.classList.add('active'); loadGrade(g); };
    tabs.appendChild(div);
  });
}

async function loadGrade(grade){
  $('msg').className = 'msg';
  // 1–9 razred: samo dejavnosti iz xlsx (dnevi dejavnosti).
  // IP/POUK: ročne (manual) dejavnosti + tedenske rezervacije.
  const source = isGradeNumeric(grade) ? 'xlsx' : 'manual';
  const url = '/api/dejavnosti?grade=' + encodeURIComponent(grade) + '&source=' + source;
  const rows = await api(url).catch(() => []);
  sectionsData[grade] = {};
  if(isGradeNumeric(grade)){
    SECTIONS.forEach(s => sectionsData[grade][s] = rows.filter(r => r.section === s));
  }else{
    sectionsData[grade]['_all'] = rows;
  }
  renderGrade(grade);
  loadExisting(grade);
}

// Prikaz obstoječih (ročno vnesenih) serijskih rezervacij in dni dejavnosti
// — sinhronizirano z bazo (isti vir kot koledar).
async function loadExisting(grade){
  try{
    const series = await api('/api/rezervacije/series-list').catch(()=>[]);
    const cont = document.getElementById('existing-container');
    if(!cont) return;
    // Samo serijske rezervacije (tedenske redne ure), ki niso del dnevov
    // dejavnosti — dnevov dejavnosti ni več tukaj, so v sekcijah zgoraj.
    let html = `<h3 style="margin-top:28px;">🗄️ Serijske rezervacije (${series.length})</h3>`;
    if(series.length === 0){
      html += `<p class="muted">Ni serijskih rezervacij.</p>`;
    }else{
      html += `<table><thead><tr><th>Ime</th><th>Prostor</th><th>Obdobje</th><th>Terminov</th></tr></thead><tbody>`;
      series.forEach(s => {
        html += `<tr><td>${esc(s.name || 'Dogodek')}</td><td>${prostLabel(s.prostor)}</td>` +
                `<td>${s.min_date} → ${s.max_date}</td><td>${s.count}</td></tr>`;
      });
      html += `</tbody></table>`;
    }
    cont.innerHTML = html;
  }catch(e){ /* tiho — ni kritično */ }
}

function letterOddelki(grade){
  if(grade === 'ip' || grade === 'pouk') return [];
  return (META.razredi||[]).filter(r => r.startsWith(grade + '.') && /^\d+\.[a-zč]$/.test(r));
}

function renderGrade(grade){
  const cont = $('content');
  const label = GRADE_LABELS[grade] || grade;
  let html = `<h3>PREGLED DEJAVNOSTI ${label.toUpperCase()}</h3>`;

  if(isGradeNumeric(grade)){
    // 1–9 razred: sekcije (dnevi dejavnosti iz xlsx)
    html += `<p class="hint">Dejavnosti iz predloge (dnevi_dejavnosti_v_evrih.xlsx). Za urejanje shrani vrstico — blokade/rezervacije se izvedejo pri datum+celoten dan+prostori.</p>`;
    html += `<div class="toolbar">`;
    SECTIONS.forEach(s => {
      html += `<button class="btn btn-success" onclick="addRow('${s}','xlsx')">＋ ${s} DAN</button>`;
    });
    html += `</div>`;
    SECTIONS.forEach(s => {
      const rows = (sectionsData[grade] && sectionsData[grade][s]) || [];
      html += `<div class="section-title">${s} DNEVI (${rows.length})</div>`;
      html += renderSectionTable(grade, s, rows);
    });
  }else{
    // IP/POUK: brez sekcij — ročne dejavnosti + tedenske rezervacije
    const rows = (sectionsData[grade] && sectionsData[grade]['_all']) || [];
    html += `<p class="hint">Sem sodijo sami ročno dodani dogodki in tedenske rezervacije, ki niso v Excel predlogi.</p>`;
    html += `<div class="toolbar"><button class="btn btn-success" onclick="openEditor({grade:'${grade}', section:'', title:'', subtitle:'', full_day:false, recurring:true, date_from:'', date_to:'', date_undetermined:false, date_text:'', all_classes:false, classes:'', prostori:'', cena:'', vodja:'', opomba:''})">＋ Dodaj dogodek / tedensko rezervacijo</button></div>`;
    html += `<div class="section-title">Ročne dejavnosti (${rows.length})</div>`;
    if(rows.length === 0){
      html += `<p class="muted">Ni ročno dodanih dejavnosti.</p>`;
    }else{
      html += renderSectionTable(grade, '', rows, true);
    }
    // IP/POUK: serijske rezervacije, ki niso povezane z dejavnostmi
    html += `<div id="existing-container"></div>`;
  }
  cont.innerHTML = html;
}

function renderSectionTable(grade, section, rows, isManual){
  // Prikaz po vzoru xlsx predloge: Dejavnost | čas | vodja | cena | opomba |
  // Računalnica | Tablice | Ladja | Gospodinjska učilnica | Akcije
  const rooms = ['racunalnica', 'tablice', 'ladja', 'gospodinjska-ucilnica'];
  let html = `<table><thead><tr>
    <th>Dejavnost</th>
    <th>Okvirni čas izvedbe</th>
    <th>Vodja</th>
    <th>Pribl. cena (€)</th>
    <th>Opomba</th>
    <th title="Računalnica">Rač.</th>
    <th title="Tablice">Tab.</th>
    <th title="Ladja">Ladja</th>
    <th title="Gospodinjska učilnica">Gosp.</th>
    <th>Akcije</th>
  </tr></thead><tbody>`;
  if(!rows || rows.length === 0){
    html += `<tr><td colspan="10" class="muted">Ni vnesenih dejavnosti za to sekcijo.</td></tr>`;
    html += `</tbody></table>`;
    return html;
  }
  // Združimo: poddejavnosti, ki delijo parent_title, so prikazane z zamikom,
  // brez dodatne pasice — ker je modri naslov sekcije (npr. "TEHNIŠKI DNEVI")
  // že gor, ne želimo ponavljati naziva sekcije v vsaki vrstici.
  rows.forEach(r => {
    const isSub = !!(r.parent_title && r.parent_title !== r.title);
    const sel = (r.prostori||'').split(',').map(x=>x.trim());
    const roomCells = rooms.map(room => {
      const on = sel.includes(room);
      return `<td style="text-align:center;">${on ? '❌' : ''}</td>`;
    }).join('');
    // Naslov: pod-dejavnost z zamikom; samostojna dejavnost brez
    const titleHtml = (isSub ? '<span style="margin-left:14px;color:#333;">• ' : '') + esc(r.title) + (isSub ? '</span>' : '');
    const timeHtml = fullTime(r);
    html += `<tr data-id="${r.id}">
      <td>${titleHtml}${r.subtitle ? '<div class="muted" style="margin-left:14px;">' + esc(r.subtitle) + '</div>' : ''}</td>
      <td>${timeHtml}</td>
      <td>${esc(r.vodja || '')}</td>
      <td>${esc(r.cena || '')}</td>
      <td>${r.date_undetermined ? '<div class="muted">📍 ' + esc(r.date_text||'') + '</div>' : ''}${esc(r.opomba || '')}</td>
      ${roomCells}
      <td class="row-actions">
        <button class="btn btn-warning btn-sm" onclick="editRow(${r.id})">✏️ Uredi</button>
        <button class="btn btn-danger btn-sm" onclick="delRow(${r.id})">🗑 Zbriši</button>
      </td>
    </tr>`;
  });
  html += `</tbody></table>`;
  return html;
}

// Poln okvirni čas: upošteva termini (več datumov z razredi), date_text
// (vsebuje npr. "9. 2. 2027 (6. a)"), drugače izpelje iz date_from/date_to.
function fullTime(r){
  if(r.date_undetermined) return '<span class="muted">ni določen → ' + esc(r.date_text||'') + '</span>';
  if(r.termini && Array.isArray(r.termini) && r.termini.length > 0){
    const lines = r.termini.map(t => {
      const ds = t.date || '';
      const cl = t.classes ? ' (' + t.classes.replace(/,/g, ', ') + ')' : '';
      return '<div>• ' + esc(ds + cl) + '</div>';
    }).join('');
    return lines;
  }
  if(r.date_text && !/^\s*-/.test(r.date_text)) return esc(r.date_text);
  return fmtDateRange(r);
}

// ── Modal / inline za dodajanje in urejanje ────────────────────────
let editMode = null; // {id}
function addRow(section){
  openEditor({grade: currentGrade, section, title:'', subtitle:'', full_day:true, recurring:false,
    date_from:'', date_to:'', date_undetermined:false, date_text:'', all_classes:true,
    classes:'', prostori:'', cena:'', vodja:'', opomba:''});
}
function editRow(id){
  const rows = Object.values(sectionsData[currentGrade]||{}).flat();
  const r = rows.find(x => x.id === id);
  if(r) openEditor(r);
}
function delRow(id){
  if(!confirm('Zbrisati to dejavnost?')) return;
  api('/api/dejavnosti/' + id, {method:'DELETE'}).then(()=>{
    showMsg('Dejavnost izbrisana', 'success'); loadGrade(currentGrade);
  }).catch(e=>showMsg(e.message,'error'));
}

function openEditor(r){
  // poenostavljen modal napolnjen s podatki
  const classes = letterOddelki(r.grade);
  const prostoriAvail = META.prostori;
  const isNum = isGradeNumeric(r.grade);
  const sectionSel = SECTIONS.map(s=>`<option value="${s}" ${s===r.section?'selected':''}>${s}</option>`).join('');
  const classChecks = classes.map(c => {
    const inClasses = (r.classes||'').split(',').map(x=>x.trim()).includes(c);
    const checked = r.all_classes ? 'checked' : (inClasses ? 'checked' : '');
    return `<label><input type="checkbox" class="cls" value="${c}" ${checked}> ${c}</label>`;
  }).join('');
  const prostCheck = prostoriAvail.map(p => {
    const checked = (r.prostori||'').split(',').map(x=>x.trim()).includes(p);
    return `<label><input type="checkbox" class="prost" value="${p}" ${checked?'checked':''}> ${prostLabel(p)}</label>`;
  }).join('');

  const overlay = document.createElement('div');
  overlay.id = 'editor';
  overlay.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:center;justify-content:center;';
  overlay.innerHTML = `
    <div style="background:white;padding:22px;border-radius:10px;width:720px;max-width:95%;max-height:90vh;overflow:auto;">
      <h3 style="margin-top:0;">${r.id ? 'Uredi dejavnost' : 'Nova dejavnost'}</h3>
      <div class="toolbar"><label>Razred (generacija): <b>${GRADE_LABELS[r.grade]||r.grade}</b></label>
        <input type="hidden" id="e-source" value="${r.source || (isNum ? 'xlsx' : 'manual')}">
      </div>
      <div class="toolbar">
        ${isNum ? `<label>Sekcija:
          <select id="e-section" style="min-width:170px;">${sectionSel}</select>
        </label>` : `<input type="hidden" id="e-section" value="">`}
        <label>Glavni naslov:
          <input type="text" id="e-title" value="${escAttr(r.title)}" style="width:260px;" placeholder="(privzeto: SEKCIJA X. razred)">
        </label>
      </div>
      <div class="toolbar">
        <label>Pod dejavnost:
          <input type="text" id="e-subtitle" value="${escAttr(r.subtitle)}" style="width:400px;" placeholder="npr. Oblak 365, Powerpoint">
        </label>
      </div>
      <div class="toolbar">
        <label><input type="checkbox" id="e-full" ${r.full_day?'checked':''}> Celoten dan (rezervira 1.–5. uro)</label>
        <label><input type="checkbox" id="e-recurring" ${r.recurring?'checked':''}> Tedensko ponavljanje</label>
        <label><input type="checkbox" id="e-undet" ${r.date_undetermined?'checked':''} onchange="toggleUndet(this)"> Datum ni še določen</label>
      </div>
      <div class="toolbar" id="date-fields">
        <div style="width:100%;">
          <b>Datumi</b> <span class="hint">(določi več datumov — npr. vsak razred na svoj dan)</span>
          <div id="termini-list" style="margin:6px 0;"></div>
          <button type="button" class="btn" onclick="addTerminRow()">＋ Dodaj datum</button>
          <label style="margin-left:12px;">Od: <input type="date" id="e-dfrom" value="${r.date_from||''}"></label>
          <label>Do: <input type="date" id="e-dto" value="${r.date_to||''}"></label>
        </div>
      </div>
      <div class="toolbar hide" id="date-text-field">
        <label>Ocena termina: <input type="text" id="e-dtext" value="${escAttr(r.date_text)}" style="width:300px;" placeholder="npr. oktober–november"></label>
      </div>
      <div class="toolbar" style="align-items:flex-start;">
        <div style="margin-right:20px;">
          <b>Razredi:</b>
          ${classChecks || '<span class="muted">(IP/POUK — ni črkovnih oddelkov)</span>'}
          <label style="display:block;margin-top:4px;"><input type="checkbox" id="e-allcls" ${r.all_classes?'checked':''} onchange="toggleAllCls(this)"> <b>Vsi razredi</b></label>
        </div>
        <div>
          <b>Prostori:</b> ${prostCheck || '<span class="muted">(ni razpoložljivih prostorov)</span>'}
        </div>
      </div>
      <div class="toolbar">
        <label>Cena (€): <input type="text" id="e-cena" value="${escAttr(r.cena)}" style="width:120px;" placeholder="npr. 3 ali 225,00 EVR"></label>
        <label>Vodja: <input type="text" id="e-vodja" value="${escAttr(r.vodja)}" style="width:240px;"></label>
      </div>
      <div class="toolbar">
        <label>Opomba: <input type="text" id="e-opomba" value="${escAttr(r.opomba)}" style="width:100%;"></label>
      </div>
      <div style="text-align:right;margin-top:16px;">
        <button class="btn btn-danger" onclick="document.body.removeChild(this.closest('#editor'))" style="margin-right:6px;">Prekliči</button>
        <button class="btn btn-success" onclick="saveRow(${r.id || 'null'})">💾 Shrani</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  toggleUndet($('e-undet'));
  toggleAllCls($('e-allcls'));
  editMode = {id: r.id || null};
  populateTermini(r.termini || []);
}

// ── Termini: več datumov pod eno dejavnost ─────────────────────────
// Vsaka vrstica ima datum + izbrane razrede (vsi črkovni oddelki generacije).
function terminRowHtml(term, idx){
  const classes = letterOddelki(term.grade || currentGrade);
  const pick = classes.map(c => {
    const on = (term.classes||'').split(',').map(x=>x.trim()).includes(c);
    return `<label><input type="checkbox" class="t-cls" value="${c}" ${on?'checked':''}> ${c}</label>`;
  }).join('');
  return `<div class="t-row" data-idx="${idx}" style="border:1px solid #ddd;border-radius:4px;padding:6px;margin-bottom:4px;display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap;">
    <label>Datum: <input type="date" class="t-date" value="${term.date||''}"></label>
    <div><b>Razredi:</b> ${pick || '<span class="muted">(ni črkovnih oddelkov)</span>'}</div>
    <button type="button" class="btn btn-danger btn-sm" onclick="delTerminRow(this)">✕</button>
  </div>`;
}
function addTerminRow(term){
  const list = $('termini-list');
  if(!list) return;
  const idx = list.children.length;
  list.insertAdjacentHTML('beforeend', terminRowHtml(term || {}, idx));
}
function delTerminRow(btn){
  btn.closest('.t-row').remove();
}
function populateTermini(terms){
  (terms||[]).forEach(t => addTerminRow(t));
  if(!terms || terms.length===0) addTerminRow({});
}
function collectTermini(){
  const out = [];
  document.querySelectorAll('#termini-list .t-row').forEach(row => {
    const date = row.querySelector('.t-date').value;
    const cls = Array.from(row.querySelectorAll('.t-cls:checked')).map(x=>x.value);
    if(date) out.push({date, classes: cls.join(',')});
  });
  return out;
}

function toggleUndet(cb){
  if(cb.checked){ $('date-fields').classList.add('hide'); $('date-text-field').classList.remove('hide'); }
  else { $('date-fields').classList.remove('hide'); $('date-text-field').classList.add('hide'); }
}
function toggleAllCls(cb){
  document.querySelectorAll('#editor input.cls').forEach(x => x.checked = cb.checked);
}

function saveRow(id){
  const undet = $('e-undet').checked;
  const all = $('e-allcls').checked;
  const classes = Array.from(document.querySelectorAll('#editor input.cls:checked')).map(x=>x.value);
  const prost = Array.from(document.querySelectorAll('#editor input.prost:checked')).map(x=>x.value);
  const payload = {
    grade: currentGrade,
    section: $('e-section').value,
    source: $('e-source').value || 'manual',
    title: $('e-title').value,
    subtitle: $('e-subtitle').value,
    full_day: $('e-full').checked,
    recurring: $('e-recurring').checked,
    date_from: undet ? null : ($('e-dfrom').value || null),
    date_to: undet ? null : ($('e-dto').value || null),
    date_undetermined: undet,
    date_text: undet ? $('e-dtext').value : '',
    all_classes: all,
    classes: all ? '' : classes.join(','),
    prostori: prost.join(','),
    cena: $('e-cena').value,
    vodja: $('e-vodja').value,
    opomba: $('e-opomba').value,
    termini: collectTermini(),
  };
  const method = id ? 'PUT' : 'POST';
  const url = id ? '/api/dejavnosti/' + id : '/api/dejavnosti';
  api(url, {method, headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload)})
    .then(res => {
      showMsg('Dejavnost shranjena.', 'success');
      document.body.removeChild(document.getElementById('editor'));
      loadGrade(currentGrade);
    }).catch(e => showMsg(e.message, 'error'));
}

// ── pomožne ────────────────────────────────────────────────────────
function esc(s){ return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escAttr(s){ return esc(s); }
function fmtDateRange(r){
  if(r.date_undetermined) return '<span class="muted">ni določen</span>';
  if(!r.date_from) return '—';
  if(r.date_to && r.date_to !== r.date_from) return r.date_from + ' → ' + r.date_to;
  return r.date_from;
}
function prostLabel(p){
