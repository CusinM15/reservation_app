[pytest]
testpaths = tests
# Prikrij znane deprecation warninge iz fastapi/starlette (ne naša koda),
# da je CI izpis čist; naši warningi se še vedno pokažejo.
filterwarnings =
    ignore:asyncio.iscoroutinefunction is deprecated:DeprecationWarning
    ignore:on_event is deprecated:DeprecationWarning
    ignore:The `name` is not the first parameter:DeprecationWarning
    ignore:datetime.datetime.utcnow\(\) is deprecated:DeprecationWarning
