apiVersion: batch/v1
kind: CronJob
metadata:
  name: sola-db-backup
  namespace: sola-app
spec:
  schedule: "0 4 * * *"
  timeZone: "Europe/Ljubljana"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      # Brez ponavljanja: pošiljanje e-pošte ni ponovljivo dejanje, zato ob
      # napaki zagon TAKOJ odpove (brez retryjev) — sicer bi vsak retry znova
      # poslal kopijo vsem šolam (dokazano 2026-10-02: 7 zagonov = 7 e-poštnih
      # sporočil, ker je ena šola imela neveljaven BACKUP_EMAIL).
      backoffLimit: 0
      template:
        spec:
          containers:
          - name: backup
            image: mato12345/sola-app:latest
            imagePullPolicy: Always
            # Vsaka šola dobi SVOJO .sql kopijo (samo njeni podatki) po e-pošti.
            # Zakaj ne pg_dump? Izvozil bi CELO bazo (vse šole v eni datoteki).
            # (Stari scripts.db_backup je odpovedal zaradi manjkajočega
            # SECRET_KEY v tem CronJobu — pg_dump je v sliki sicer prisoten.)
            command:
            - python
            - -m
            - scripts.school_backups
            # envFrom (kot v deploymentu): tako job dobi VSE ključe iz
            # sola-secrets — tudi SECRET_KEY, brez katerega app.config ob
            # importu pade (točno to je podrlo prejšnji nočni job).
            envFrom:
            - secretRef:
                name: sola-secrets
          restartPolicy: OnFailure
